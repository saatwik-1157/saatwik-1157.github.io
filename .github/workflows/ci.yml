# Static site checks: local links/assets, JS syntax, HTML validity.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  links:
    name: Local links and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --offline: only local files and #anchors are checked, so no network flakiness.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress './*.html'
          fail: true

  checks:
    name: JS syntax and HTML validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: node --check every JS file
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -r -n1 -t node --check
      - name: html-validate (standard preset)
        run: npx --yes html-validate@11 --preset=standard $(git ls-files '*.html')
